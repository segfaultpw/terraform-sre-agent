name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than floating: a formatting change in a new Terraform
      # release would otherwise fail CI on a PR that changed nothing.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate every module and example
        run: |
          set -euo pipefail
          failed=0
          for dir in modules/*/ examples/*/; do
            echo "==> $dir"
            if ! (cd "$dir" && terraform init -backend=false -input=false > /dev/null && terraform validate); then
              failed=1
            fi
          done
          exit $failed

      # A module with a `tests/` directory pins its policy against the one the product derives.
      - name: Run module tests
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            [ -d "${dir}tests" ] || continue
            echo "==> $dir"
            (cd "$dir" && terraform init -backend=false -input=false > /dev/null && terraform test)
          done

  # The verifier module's poller is code that runs in a customer's account, and its task role is
  # the one thing that must stay empty: the repository's own code runs as it.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The poller's tests
        run: python3 -I -W error::ResourceWarning -m unittest discover -s modules/verifier/lambda -v

      # poller.py is a byte-identical copy of verifier/poller/poller.py in the sre-agent
      # repository, and each repository pins the sha256 of its copy in poller.py.sha256 (the
      # same digest in both). The repositories are different, so no job can compare the bytes:
      # a change to either copy has to edit its own pin, which is the cue to change the other
      # repository's copy and pin in the same piece of work.
      - name: The poller matches its pinned digest
        working-directory: modules/verifier/lambda
        run: sha256sum -c poller.py.sha256

      - name: The task role has no permissions
        run: |
          set -euo pipefail
          # Nothing in the module may attach a policy to, or add one on, the task role.
          if grep -nE '(role|roles)[[:space:]]*=.*aws_iam_role\.task\.' modules/verifier/*.tf; then
            echo "::error::the verifier task role must have no policies"
            exit 1
          fi
          # Nor may a role carry policies in its own block or as managed ARNs.
          if grep -nE 'managed_policy_arns|inline_policy' modules/verifier/main.tf; then
            echo "::error::no role in the verifier module may embed policies; the task role must have none"
            exit 1
          fi
          if grep -nE 'aws_iam_role_policy(_attachment)?"[[:space:]]+"[a-z_]+"' modules/verifier/main.tf | grep -v -E '"(execution|poller)"'; then
            echo "::error::only the execution role and the poller may have policies"
            exit 1
          fi

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Lint
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "==> $dir"
            (cd "$dir" && tflint --init && tflint)
          done
