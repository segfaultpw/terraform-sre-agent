name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than floating: a formatting change in a new Terraform
      # release would otherwise fail CI on a PR that changed nothing.
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate every module and example
        run: |
          set -euo pipefail
          failed=0
          for dir in modules/*/ examples/*/; do
            echo "==> $dir"
            if ! (cd "$dir" && terraform init -backend=false -input=false > /dev/null && terraform validate); then
              failed=1
            fi
          done
          exit $failed

      # A module with a `tests/` directory pins its policy against the one the product derives.
      - name: Run module tests
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            [ -d "${dir}tests" ] || continue
            echo "==> $dir"
            (cd "$dir" && terraform init -backend=false -input=false > /dev/null && terraform test)
          done

  # The verifier module's poller is code that runs in a customer's account, and its task role is
  # the one thing that must stay empty: the repository's own code runs as it.
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: The poller's tests
        run: python3 -I -W error::ResourceWarning -m unittest discover -s modules/verifier/lambda -v

      # poller.py is a byte-identical copy of verifier/poller/poller.py in the sre-agent
      # repository, and each repository pins the sha256 of its copy in poller.py.sha256 (the
      # same digest in both). The repositories are different, so no job can compare the bytes:
      # a change to either copy has to edit its own pin, which is the cue to change the other
      # repository's copy and pin in the same piece of work.
      - name: The poller matches its pinned digest
        working-directory: modules/verifier/lambda
        run: sha256sum -c poller.py.sha256

      - name: The task role has no permissions
        run: |
          set -euo pipefail
          # Nothing in the module may attach a policy to, or add one on, the task role.
          if grep -nE '(role|roles)[[:space:]]*=.*aws_iam_role\.task\.' modules/verifier/*.tf; then
            echo "::error::the verifier task role must have no policies"
            exit 1
          fi
          # Nor may a role carry policies in its own block or as managed ARNs.
          if grep -nE 'managed_policy_arns|inline_policy' modules/verifier/main.tf; then
            echo "::error::no role in the verifier module may embed policies; the task role must have none"
            exit 1
          fi
          if grep -nE 'aws_iam_role_policy(_attachment)?"[[:space:]]+"[a-z_]+"' modules/verifier/main.tf | grep -v -E '"(execution|poller)"'; then
            echo "::error::only the execution role and the poller may have policies"
            exit 1
          fi

  # The fix runner dials out and nothing dials in, and its image switches between two accounts
  # itself: a listener, a load balancer, a second ingress rule or a posix_user on the access point
  # would each break one of those. modules/fix-runner/tests pins the same facts on the plan; this
  # catches the text of an edit before a plan has to.
  fix-runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Nothing connects to the runner, and the access point forces no user
        run: |
          set -euo pipefail
          f=modules/fix-runner/main.tf
          if grep -nE '^[[:space:]]*(posix_user|load_balancer|ingress|inline_policy)[[:space:]]*\{' "$f"; then
            echo "::error::the fix runner takes no inbound connection, has no load balancer, and its access point must not set a posix_user"
            exit 1
          fi
          if [ "$(grep -cE '^resource "aws_vpc_security_group_ingress_rule"' "$f")" != 1 ]; then
            echo "::error::the only ingress rule is NFS from the task to its own volume"
            exit 1
          fi
          if grep -nE 'managed_policy_arns|port_mappings|portMappings' "$f"; then
            echo "::error::the fix runner has no port, and the task role takes policies only through extra_policy_arns"
            exit 1
          fi
          # The only attachment is "extra" (the task role's extra_policy_arns), and the only inline
          # policies are the execution role's and the task role's: an AWS managed policy attached to
          # the execution role would reach every log group and repository.
          if grep -nE '^resource "aws_iam_role_policy_attachment"' "$f" | grep -v -E '"extra"'; then
            echo "::error::the only policy attachment is extra, on the task role"
            exit 1
          fi
          if grep -nE '^resource "aws_iam_role_policy"' "$f" | grep -v -E '"(execution|task)"'; then
            echo "::error::only the execution role and the task role have inline policies"
            exit 1
          fi
          if grep -nE '^resource "(aws_iam_policy_attachment|aws_iam_role_policies_exclusive|aws_iam_role_policy_attachments_exclusive|aws_security_group_rule)"' "$f"; then
            echo "::error::no aws_iam_policy_attachment, exclusive attachment set or aws_security_group_rule: each reaches a role or a group without showing as one of the module's rules"
            exit 1
          fi
          if [ "$(grep -cE '^resource "aws_vpc_security_group_egress_rule"' "$f")" != 3 ]; then
            echo "::error::three egress rules only: HTTPS, NFS to the volume, and extra_egress_ports"
            exit 1
          fi

      # The runner sends each secret as it is in a request header, and a trailing newline there is
      # rejected, so a runner whose secrets were made with cat and Enter never polls.
      - name: The documented way to create a secret writes no trailing newline
        run: |
          set -euo pipefail
          docs="modules/fix-runner/README.md examples/fix-runner/main.tf"
          if grep -nE 'cat[[:space:]]*>[[:space:]]*value' $docs; then
            echo "::error::cat and Enter leave a trailing newline in the secret value"
            exit 1
          fi
          for d in $docs; do
            if ! grep -qF "printf '%s' \"\$value\" > value.txt" "$d"; then
              echo "::error::$d must write the secret with printf '%s' \"\$value\" > value.txt"
              exit 1
            fi
            if ! grep -qF 'IFS= read -rs value' "$d"; then
              echo "::error::$d must read the secret with IFS= read -rs value"
              exit 1
            fi
          done

  tflint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest
      - name: Lint
        run: |
          set -euo pipefail
          for dir in modules/*/; do
            echo "==> $dir"
            (cd "$dir" && tflint --init && tflint)
          done
